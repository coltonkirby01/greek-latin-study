name: Apply Stats and select UI patch

on:
  push:
    branches:
      - chatgpt/manage-legacy-sessions

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[stats-select-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/manage-legacy-sessions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-stats-and-select-ui.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css src/pages/stats-page.css AGENTS.md
          git commit -m "Polish Stats separation and toolbar selects [stats-select-ui]"
          git push origin HEAD:chatgpt/manage-legacy-sessions
