name: Apply legacy session Stats patch

on:
  push:
    branches:
      - chatgpt/manage-legacy-sessions

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[legacy-session-stats]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/manage-legacy-sessions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-legacy-session-stats.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/stats-page.tsx
          git commit -m "Enable legacy session management and separate recent reviews [legacy-session-stats]"
          git push origin HEAD:chatgpt/manage-legacy-sessions
