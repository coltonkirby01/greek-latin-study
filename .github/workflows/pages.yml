name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply targeted dependency patches
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/dependency-security-audit-v2'
        run: |
          npm install --save-exact react-router-dom@7.18.3
          npm install --save-dev --save-exact vite@6.4.3 vitest@3.2.6
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Patch audited frontend dependencies"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - name: Dependency audit report
        run: npm audit --json || true
      - run: npm test
      - run: npm run build:pages
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Wait for any legacy Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..24}; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")][0].status // "completed"')
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Continuing after the legacy Pages wait window."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
